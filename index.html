<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>html,body{background:#0b1a2e!important}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a3a5c">
    <meta name="apple-mobile-web-app-title" content="العصر الذهبي">
    <meta name="msapplication-TileColor" content="#1a3a5c">
    <meta name="description" content="العصر الذهبي - متجرك الإلكتروني المتكامل">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>العصر الذهبي - تسوق أونلاين</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231a3a5c'/%3E%3Ctext x='90' y='105' text-anchor='middle' font-size='60' font-family='sans-serif' font-weight='bold' fill='%23c9a243'%3E%D8%B0%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function() {
            var saved = localStorage.getItem('gac-theme');
            if (saved === 'light') {
                document.documentElement.classList.add('light-mode');
            }
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function(){});
            }
        })();
    </script>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <template v-if="$route.path === '/login'">
                <router-view></router-view>
            </template>
            <template v-else>
                <app-header></app-header>
                <main class="main-content">
                    <router-view v-slot="{ Component }">
                        <transition name="page-fade" mode="out-in">
                            <component :is="Component" />
                        </transition>
                    </router-view>
                </main>
                <app-navbar></app-navbar>
            </template>
        </div>
    </div>

    <script type="text/javascript" src="components/GuestWarning.js"></script>
    <script type="text/javascript" src="components/AppHeader.js"></script>
    <script type="text/javascript" src="components/AppNavbar.js"></script>
    <script type="text/javascript" src="pages/LoginPage.js"></script>
    <script type="text/javascript" src="pages/HomePage.js"></script>
    <script type="text/javascript" src="pages/CategoriesPage.js"></script>
    <script type="text/javascript" src="pages/CartPage.js"></script>
    <script type="text/javascript" src="pages/InstallmentsPage.js"></script>
    <script type="text/javascript" src="pages/AccountPage.js"></script>
    <script type="text/javascript" src="pages/CategoryPage.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
</body>
</html>
